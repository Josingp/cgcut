name: Build Windows exe

on:
  push:
    branches: [main]
    paths: ["cgcut.py", "cgcut_gui.py", ".github/workflows/build-exe.yml", "requirements.txt", "RELEASE_NOTES.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyinstaller openpyxl pypdf

      - name: Download ffmpeg (gyan.dev essentials)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffzip
          $bin = Get-ChildItem ffzip -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force ffbin | Out-Null
          Copy-Item $bin.FullName ffbin/ffmpeg.exe
          Copy-Item (Join-Path $bin.DirectoryName ffprobe.exe) ffbin/ffprobe.exe
          & ffbin/ffmpeg.exe -version | Select-Object -First 1

      - name: Tests (source)
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$PWD/ffbin;" + $env:PATH
          $env:PYTHONIOENCODING = "utf-8"
          python -m pip install pytest
          "== pytest ==" | Out-File test.log
          python -m pytest -q tests 2>&1 | Tee-Object -Append test.log
          "== gui smoke ==" | Out-File -Append test.log
          python tests/gui_smoke.py gui_smoke 2>&1 | Tee-Object -Append test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report test result as commit comment
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tail = (Get-Content test.log -Tail 120) -join "`n"
          $body = "cgcut CI tests failed:`n`n``````text`n$tail`n``````"
          $body | Out-File body.txt -Encoding utf8
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.txt | Out-Null

      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name cgcut `
            --add-binary "ffbin/ffmpeg.exe;." --add-binary "ffbin/ffprobe.exe;." `
            --collect-submodules openpyxl --collect-submodules pypdf `
            cgcut_gui.py
          Get-Item dist/cgcut.exe | Format-List Name, Length

      - name: Smoke test exe (CLI mode, bundled ffmpeg)
        id: exetest
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          try {
            $env:PATH = "$PWD/ffbin;" + $env:PATH
            python tests/make_sample.py exe_sample
            # --windowed exe는 터미널에서 바로 분리되므로 끝날 때까지 기다린다
            $exe = (Resolve-Path dist/cgcut.exe).Path
            $p = Start-Process -FilePath $exe -ArgumentList @("exe_sample/CG_list_sample.xlsx", "--video", "exe_sample/EP01_sample.mov", "-o", "exe_out", "--codec", "h264", "--sheet", "EP01") -Wait -PassThru -NoNewWindow -RedirectStandardOutput exe.out.log -RedirectStandardError exe.err.log
            "exit code: $($p.ExitCode)" | Out-File exe.log
            if (Test-Path exe.out.log) { Get-Content exe.out.log | Out-File -Append exe.log }
            if (Test-Path exe.err.log) { Get-Content exe.err.log | Out-File -Append exe.log }
            $n = @(Get-ChildItem exe_out -Filter *.mp4).Count
            "exe outputs: $n" | Out-File -Append exe.log
            "LASTEXITCODE before end: $LASTEXITCODE" | Out-File -Append exe.log
            Get-Content exe.log
            if ($n -ne 6) { throw "expected 6 outputs, got $n" }
            $global:LASTEXITCODE = 0
            exit 0
          } catch {
            "STEP ERROR: $_" | Out-File -Append exe.log
            $Error | Out-String | Out-File -Append exe.log
            exit 1
          }

      - name: Report exe test result
        if: steps.exetest.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tail = (Get-Content exe.log -Tail 120) -join "`n"
          $body = "cgcut exe smoke test failed:`n`n``````text`n$tail`n``````"
          $body | Out-File body2.txt -Encoding utf8
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body2.txt | Out-Null
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: cgcut-windows
          path: dist/cgcut.exe

      - name: Release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: cgcut (최신 빌드)
          body_path: RELEASE_NOTES.md
          files: dist/cgcut.exe
          prerelease: false
